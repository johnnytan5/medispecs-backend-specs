services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medispecs-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MediSpecs API
      - APP_VERSION=1.0.0
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./:/app
      - db_data:/app/data
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem
    privileged: true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - medispecs-network

  # Uncomment below to add PostgreSQL database
  # db:
  #   image: postgres:15-alpine
  #   container_name: medispecs-db
  #   environment:
  #     - POSTGRES_USER=medispecs
  #     - POSTGRES_PASSWORD=medispecs_password
  #     - POSTGRES_DB=medispecs
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - medispecs-network

networks:
  medispecs-network:
    driver: bridge

volumes:
  db_data:

