services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medispecs-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MediSpecs API
      - APP_VERSION=1.0.0
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - DOCKER_CONTAINER=true  # Flag to indicate running in Docker
      - TZ=Asia/Singapore  # Set your timezone (UTC, America/New_York, Europe/London, etc.)
    env_file:
      - .env
    volumes:
      - ./:/app
      - db_data:/app/data
      - /etc/localtime:/etc/localtime:ro  # Sync with host timezone
    devices:
      - /dev/i2c-1:/dev/i2c-1          # OLED display via I2C
      - /dev/gpiomem:/dev/gpiomem      # GPIO access
      - /dev/video0:/dev/video0        # Camera (USB or Pi Camera via v4l2)
      - /dev/vchiq:/dev/vchiq          # VideoCore interface (for Pi Camera)
      - /dev/video10:/dev/video10      # Pi Camera ISP
      - /dev/video11:/dev/video11      # Pi Camera ISP
      - /dev/video12:/dev/video12      # Pi Camera ISP
    privileged: true                    # Required for hardware access
    group_add:
      - video                           # Add video group for camera access
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - medispecs-network

  # Uncomment below to add PostgreSQL database
  # db:
  #   image: postgres:15-alpine
  #   container_name: medispecs-db
  #   environment:
  #     - POSTGRES_USER=medispecs
  #     - POSTGRES_PASSWORD=medispecs_password
  #     - POSTGRES_DB=medispecs
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - medispecs-network

networks:
  medispecs-network:
    driver: bridge

volumes:
  db_data:

